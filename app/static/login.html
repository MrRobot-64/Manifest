<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manifest - Sign in</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c2330;--muted:#667085;--line:#e4e7ec;--accent:#2563eb;--warn:#a15c00}
:root[data-theme=dark]{--bg:#0f131a;--card:#171c26;--text:#e6e9ef;--muted:#8b94a5;--line:#2a3140;--accent:#5b8def;--warn:#f5b84d}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f131a;--card:#171c26;--text:#e6e9ef;--muted:#8b94a5;--line:#2a3140;--accent:#5b8def;--warn:#f5b84d}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 24px}
form[hidden]{display:none}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.brand img{width:44px;height:44px}
h1{font-size:20px;margin:0}
p.note{color:var(--muted);font-size:14px;margin:0 0 4px}
label{display:block;margin:14px 0 4px;font-size:13px;color:var(--muted)}
input{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
input.code{letter-spacing:.2em;text-align:center;font-size:18px}
button.go{width:100%;margin-top:20px;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px;font:inherit;font-weight:600;cursor:pointer}
button.go:disabled{opacity:.6;cursor:default}
.err{min-height:1.4em;margin:12px 0 0;color:var(--warn);font-size:14px}
a{color:var(--accent);font-size:14px;cursor:pointer}
.foot{margin-top:14px;text-align:center}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="brand"><img src="/static/logo.svg" alt=""><h1>Manifest</h1></div>
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <p class="err" id="err" role="alert"></p>
  <button class="go" id="go" type="submit">Sign in</button>
</form>

<form id="f2" hidden>
  <div class="brand"><img src="/static/logo.svg" alt=""><h1>Two-factor code</h1></div>
  <p class="note">Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
  <label for="c">Code</label>
  <input id="c" class="code" inputmode="text" autocomplete="one-time-code" required spellcheck="false">
  <p class="err" id="err2" role="alert"></p>
  <button class="go" id="go2" type="submit">Verify</button>
  <p class="foot"><a id="back">Back</a></p>
</form>
<script>
try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch{}
const $=id=>document.getElementById(id);
let challenge=null;
const post=(url,body)=>fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});

$("f").onsubmit=async e=>{
  e.preventDefault();$("err").textContent="";$("go").disabled=true;
  try{
    const res=await post("/api/login",{username:$("u").value,password:$("p").value});
    const out=await res.json().catch(()=>({}));
    if(res.ok&&out.needs_2fa){
      challenge=out.challenge;$("p").value="";
      $("f").hidden=true;$("f2").hidden=false;$("c").value="";$("c").focus();
    }else if(res.ok){location.href="/";return}
    else{$("err").textContent=out.detail||("Sign-in failed (HTTP "+res.status+")");$("p").value="";$("p").focus()}
  }catch{$("err").textContent="Cannot reach the server."}
  $("go").disabled=false;
};

$("f2").onsubmit=async e=>{
  e.preventDefault();$("err2").textContent="";$("go2").disabled=true;
  try{
    const res=await post("/api/login/2fa",{challenge,code:$("c").value});
    if(res.ok){location.href="/";return}
    const out=await res.json().catch(()=>({}));
    $("err2").textContent=out.detail||("Verification failed (HTTP "+res.status+")");
    if(res.status===401&&/expired/i.test(out.detail||"")){$("f2").hidden=true;$("f").hidden=false;$("err").textContent=out.detail}
    $("c").value="";$("c").focus();
  }catch{$("err2").textContent="Cannot reach the server."}
  $("go2").disabled=false;
};
$("back").onclick=()=>{challenge=null;$("f2").hidden=true;$("f").hidden=false;$("p").focus()};
</script>
</body>
</html>
