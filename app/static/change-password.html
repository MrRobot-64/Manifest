<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manifest - Choose a new password</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c2330;--muted:#667085;--line:#e4e7ec;--accent:#2563eb;--warn:#a15c00;--ok:#157f3b}
:root[data-theme=dark]{--bg:#0f131a;--card:#171c26;--text:#e6e9ef;--muted:#8b94a5;--line:#2a3140;--accent:#5b8def;--warn:#f5b84d;--ok:#5fd68a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f131a;--card:#171c26;--text:#e6e9ef;--muted:#8b94a5;--line:#2a3140;--accent:#5b8def;--warn:#f5b84d;--ok:#5fd68a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 24px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.brand img{width:44px;height:44px}
h1{font-size:20px;margin:0}
p.note{color:var(--muted);font-size:14px;margin:0 0 4px}
label{display:block;margin:14px 0 4px;font-size:13px;color:var(--muted)}
input{width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button.go{width:100%;margin-top:20px;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px;font:inherit;font-weight:600;cursor:pointer}
button.go:disabled{opacity:.6;cursor:default}
.err{min-height:1.4em;margin:12px 0 0;color:var(--warn);font-size:14px}
a{color:var(--accent);font-size:14px;cursor:pointer}
.foot{margin-top:14px;text-align:center}
</style>
</head>
<body>
<form id="f">
  <div class="brand"><img src="/static/logo.svg" alt=""><h1>Choose a new password</h1></div>
  <p class="note">You need to set your own password before you can continue. Use at least 10 characters.</p>
  <label for="cur">Current password</label>
  <input id="cur" type="password" autocomplete="current-password" required autofocus>
  <label for="n1">New password</label>
  <input id="n1" type="password" autocomplete="new-password" required minlength="10">
  <label for="n2">Repeat new password</label>
  <input id="n2" type="password" autocomplete="new-password" required minlength="10">
  <p class="err" id="err" role="alert"></p>
  <button class="go" id="go" type="submit">Change password</button>
  <p class="foot"><a id="out">Log out</a></p>
</form>
<script>
try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch{}
const $=id=>document.getElementById(id);
$("f").onsubmit=async e=>{
  e.preventDefault();$("err").textContent="";
  if($("n1").value!==$("n2").value){$("err").textContent="The new passwords do not match.";return}
  $("go").disabled=true;
  try{
    const res=await fetch("/api/change-password",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({current_password:$("cur").value,new_password:$("n1").value})});
    if(res.ok){location.href="/";return}
    if(res.status===401){location.href="/login";return}
    const out=await res.json().catch(()=>({}));
    $("err").textContent=out.detail||("Could not change the password (HTTP "+res.status+")");
  }catch{$("err").textContent="Cannot reach the server."}
  $("go").disabled=false;
};
$("out").onclick=async()=>{try{await fetch("/api/logout",{method:"POST"})}catch{}location.href="/login"};
</script>
</body>
</html>
